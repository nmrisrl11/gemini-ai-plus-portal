name: Build & Publish Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      build_mode:
        description: "Nuitka packaging mode"
        required: true
        default: "onefile"
        type: choice
        options:
          - onefile
          - standalone

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore Nuitka toolchain & ccache
        id: nuitka_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/Nuitka/Nuitka/Cache
          key: nuitka-win-py312-${{ hashFiles('requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            nuitka-win-py312-${{ hashFiles('requirements.txt') }}-
            nuitka-win-py312-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify codebase compilation, imports & tests
        run: |
          python -m compileall -q app main.py scripts tools tests
          python tests/test_portal.py

      - name: Determine release tag & build mode
        id: meta
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $mode = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.build_mode }}" } else { "onefile" }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "mode=$mode" >> $env:GITHUB_OUTPUT
          echo "Release Tag: $tag | Build Mode: $mode"

      - name: Build hardened native Windows binary (Nuitka)
        shell: pwsh
        env:
          NUITKA_BUILD_DIR: C:\NuitkaBuild\gemini-portal
        run: |
          python scripts/build_nuitka.py --mode "${{ steps.meta.outputs.mode }}" --jobs 2

      - name: Save Nuitka toolchain & ccache immediately
        if: steps.nuitka_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/Nuitka/Nuitka/Cache
          key: ${{ steps.nuitka_cache.outputs.cache-primary-key }}

      - name: Locate release artifact
        id: artifact
        shell: pwsh
        run: |
          $mode = "${{ steps.meta.outputs.mode }}"
          if ($mode -eq "onefile") {
            $file = Get-ChildItem -Path dist -Filter "Gemini AI Plus Portal *.exe" | Select-Object -First 1
          } else {
            $file = Get-ChildItem -Path dist -Filter "Gemini AI Plus Portal *-win64.zip" | Select-Object -First 1
          }
          if (-not $file) { throw "Release artifact not found in dist/" }
          echo "path=$($file.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($file.Name)" >> $env:GITHUB_OUTPUT

      - name: Check SignPath.io signing configuration
        id: signpath_check
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        run: |
          $ready = ("${{ steps.meta.outputs.mode }}" -eq "onefile") -and (-not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) -and (-not [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID))
          echo "enabled=$($ready.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Code sign artifact with SignPath.io (when configured)
        if: steps.signpath_check.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: gemini-ai-plus-portal
          signing-policy-slug: release-signing
          input-artifact-path: ${{ steps.artifact.outputs.path }}
          output-artifact-path: ${{ steps.artifact.outputs.path }}
          wait-for-completion: true

      - name: Generate SHA256SUMS.txt
        id: checksum
        shell: pwsh
        run: |
          $path = "${{ steps.artifact.outputs.path }}"
          $name = "${{ steps.artifact.outputs.name }}"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $path).Hash
          "$hash  $name" | Out-File -FilePath dist\SHA256SUMS.txt -Encoding utf8
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Scan release artifact with VirusTotal
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          python scripts/virustotal_scan.py "${{ steps.artifact.outputs.path }}" --output-md dist\vt_report.md --max-wait 360

      - name: Check Cloudflare R2 configuration
        id: r2_check
        shell: pwsh
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          $ready = (-not [string]::IsNullOrWhiteSpace($env:R2_ACCESS_KEY_ID)) -and (-not [string]::IsNullOrWhiteSpace($env:R2_SECRET_ACCESS_KEY)) -and (-not [string]::IsNullOrWhiteSpace($env:R2_ENDPOINT))
          $bucket = if ([string]::IsNullOrWhiteSpace($env:R2_BUCKET)) { "ai-plus-releases" } else { $env:R2_BUCKET.Trim() }
          echo "enabled=$($ready.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          echo "bucket=$bucket" >> $env:GITHUB_OUTPUT

      - name: Upload release & latest.json to Cloudflare R2
        if: steps.r2_check.outputs.enabled == 'true'
        id: r2_upload
        shell: pwsh
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          python -m pip install --quiet boto3
          python scripts/upload_r2.py `
            --file "${{ steps.artifact.outputs.path }}" `
            --tag "${{ steps.meta.outputs.tag }}" `
            --sha256 "${{ steps.checksum.outputs.sha256 }}" `
            --checksums "dist\SHA256SUMS.txt" `
            --bucket "${{ steps.r2_check.outputs.bucket }}"

      - name: Assemble Release Notes
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $vt = Get-Content -Path dist\vt_report.md -Raw
          $r2Url = "${{ steps.r2_upload.outputs.download_url }}"
          $r2Line = if ($r2Url) { "- **Fast CDN Mirror (Cloudflare R2):** [Direct Download ($tag)]($r2Url)`n" } else { "" }
          @"
          ## Gemini AI Plus Portal $tag

          Hardened native Windows single-file binary compiled cleanly from open-source code via GitHub Actions + Nuitka.

          ### Included Google AI Plus Plan Benefits (12 Months at No Cost)
          - **Gemini app:** Double usage limits + Hydrogen model access
          - **400 GB storage:** Shared across Google Photos, Drive, and Gmail
          - **Google Flow & Google Flow Music:** Expanded AI creative and music studio access
          - **Google Search:** More access to Nano Banana in Search
          - **Gemini in Gmail & Gemini Notebook:** Direct Gmail integration + Audio & Video Overviews

          ### Installation
          $r2Line- Download **`${{ steps.artifact.outputs.name }}`** below and double-click to launch directly (no Python or installation required).
          - Verify integrity using `SHA256SUMS.txt` if desired.

          ---

          $vt
          "@ | Out-File -FilePath dist\release_notes.md -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Gemini AI Plus Portal ${{ steps.meta.outputs.tag }}"
          body_path: dist/release_notes.md
          files: |
            ${{ steps.artifact.outputs.path }}
            dist/SHA256SUMS.txt
